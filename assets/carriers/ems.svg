<?xml version="1.0" encoding="UTF-8"?>
<!--
  EMS (Express Mail Service) — China Post Group mark.
  Red and blue winged envelope.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100">
  <defs>
    <linearGradient id="emsRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D52B1E"/>
      <stop offset="100%" stop-color="#A1160E"/>
    </linearGradient>
    <linearGradient id="emsBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003D7A"/>
      <stop offset="100%" stop-color="#001E3D"/>
    </linearGradient>
  </defs>
  <!-- Envelope back -->
  <g transform="translate(20,18)">
    <rect x="0" y="6" width="60" height="42" rx="3" fill="url(#emsRed)"/>
    <path d="M 0 8 L 30 32 L 60 8" stroke="#FFFFFF" stroke-width="2.4" fill="none"/>
    <!-- Wing left -->
    <path d="M -10 22 L 0 14 L 8 22 L 4 24 L 0 22 L -2 26 Z" fill="url(#emsBlue)"/>
    <!-- Wing right -->
    <path d="M 70 22 L 60 14 L 52 22 L 56 24 L 60 22 L 62 26 Z" fill="url(#emsBlue)"/>
  </g>
  <!-- EMS wordmark -->
  <g fill="url(#emsBlue)" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="900">
    <text x="92" y="48" font-size="34" letter-spacing="2">EMS</text>
    <text x="92" y="70" font-size="9" letter-spacing="2">EXPRESS MAIL</text>
  </g>
</svg>
