<?xml version="1.0" encoding="UTF-8"?>
<!--
  AirPak Express — square compact mark
  A red rounded-square containing a stylised "A" with a courier
  paper-plane motion trail. Used for small UI surfaces, app icon,
  avatars, and tab indicators.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="AirPak">
  <defs>
    <linearGradient id="apkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="apkGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#apkBg)"/>

  <!-- Top gloss highlight -->
  <rect x="6" y="6" width="88" height="44" rx="22" fill="url(#apkGloss)"/>

  <!-- The "A" monogram — bold geometric with crossbar = flight path -->
  <g fill="#FFFFFF">
    <!-- A triangle outer -->
    <path d="M 50 22
             L 76 76
             L 64 76
             L 60 66
             L 40 66
             L 36 76
             L 24 76
             Z"/>
    <!-- Inner triangle cutout -->
    <path d="M 50 40
             L 58 58
             L 42 58
             Z" fill="url(#apkBg)"/>
    <!-- Paper-plane motion streak (right side) -->
    <path d="M 64 30
             L 88 22
             L 78 32
             L 82 36
             L 70 36
             Z"/>
  </g>
</svg>
