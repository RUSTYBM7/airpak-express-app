name: shipnow
description: "ShipNow — AirPak Express customer & admin shipping portal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.5.6

  # Maps
  maplibre_gl: ^0.19.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.1

  # Payments
  flutter_stripe: ^11.1.0

  # Apple Wallet (iOS only — no-op on Android)
  passkit: ^1.0.0
  path_provider: ^2.1.4

  # Networking for AI + Wallet backend
  http: ^1.2.2

  # UI / utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shimmer: ^3.0.0
  pinput: ^5.0.0
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  timeline_tile: ^2.0.0
  timeago: ^3.7.0
  collection: ^1.18.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  archive: ^3.6.1
  pointycastle: ^3.9.1
  device_info_plus: ^11.1.0
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/carriers/
    - assets/brand/
